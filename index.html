<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كنيسة القديس أثناسيوس - الخدمة</title>
  <link rel="icon" href="app.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="nav">
      <div class="brand">
        <img src="img/logo.png" alt="" width="40" height="40">
        <div><strong>كنيسة القديس أثناسيوس</strong><small>سجل الخدمة</small></div>
      </div>
      <nav id="nav-links" aria-label="التنقل الرئيسي"></nav>
      <div class="save-status" id="save-status" role="status"></div>
    </aside>
    <div class="content">
      <div id="draft-banner" class="draft-banner hidden" role="alert">
        <div class="tx"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg>
          <span><b>لديك تعديلات غير مؤكدة (مسودة).</b> هي محفوظة مؤقتاً في هذا المتصفح فقط — حمّل أحدث نسخة حتى لا تضيع.</span></div>
        <button class="btn sm primary" id="draft-dl">تحميل أحدث نسخة</button>
        <button class="btn sm" id="draft-discard">تجاهل المسودة</button>
      </div>
      <main id="view" class="view"></main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
